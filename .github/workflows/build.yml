name: Build

# Runs the tests, then builds installers for Windows, macOS, Linux and Android.
# - Every push / PR: tests + builds; the installers are attached to the workflow run (Actions tab → run → Artifacts).
# - Releasing (publishes them on a GitHub Release), either:
#     Actions tab → Build → Run workflow → tick "Publish a release" (releases the version in package.json), or
#     pushing a tag like v1.0.0.
#   A version with "-" in it (1.13.0-beta.1), or "Beta" ticked, becomes a pre-release: only apps with
#   Settings → Updates → "Get beta versions" offer it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of the version in package.json
        type: boolean
        default: false
      prerelease:
        description: Beta (pre-release, only offered to apps that get beta versions)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code-signing certificate

      # Smoke-test "idle through the Steam app" in the packaged Windows app: the helper must load koffi
      # and a real DLL. kernel32.dll has no Steam entry points, so the expected answer is exactly that.
      - name: Smoke-test Steam app helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & "dist/win-unpacked/Kettle.exe" "dist/win-unpacked/resources/app.asar.unpacked/src/steamapp/helper.js" "C:\Windows\System32\kernel32.dll" 440 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'no usable entry points') { throw 'helper did not load koffi + DLL as expected' }
          exit 0   # the helper itself exits 1 here on purpose

      - uses: actions/upload-artifact@v4
        with:
          name: Kettle-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch the Node.js runtime and pack the idler
        run: android/prepare.sh

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Kettle-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Start the app on a real Android emulator and check the idler runs inside it
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/ci-smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-test
          path: |
            android/app/build/outputs/apk/release/android-smoke-screenshot.png
            android/app/build/outputs/apk/release/android-smoke-logcat.txt
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the version being released: the pushed tag, or package.json's version for "Run workflow"
      - name: Work out the version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRE_INPUT: ${{ inputs.prerelease }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="$pkg"; fi
          if [ "$tag" != "$pkg" ]; then echo "::warning::Tag $tag doesn't match package.json ($pkg)"; fi
          if [ "$REF_TYPE" != "tag" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already released. Bump the version in package.json first."; exit 1
          fi
          pre=false
          case "$tag" in *-*) pre=true;; esac
          if [ "$PRE_INPUT" = "true" ]; then pre=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (pre-release: $pre)"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Kettle-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kettle ${{ steps.v.outputs.tag }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          files: dist/*
          generate_release_notes: true
