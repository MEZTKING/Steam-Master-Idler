name: Build

# Builds installers for Windows, macOS and Linux.
# - Every push / PR: builds and attaches the installers to the workflow run (Actions tab → run → Artifacts).
# - Pushing a tag like v1.0.0: also publishes them on a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code-signing certificate

      # Smoke-test "idle through the Steam app" in the packaged Windows app: the helper must load koffi
      # and a real DLL. kernel32.dll has no Steam entry points, so the expected answer is exactly that.
      - name: Smoke-test Steam app helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & "dist/win-unpacked/Steam Master Idler.exe" "dist/win-unpacked/resources/app.asar.unpacked/src/steamapp/helper.js" "C:\Windows\System32\kernel32.dll" 440 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'no usable entry points') { throw 'helper did not load koffi + DLL as expected' }

      - uses: actions/upload-artifact@v4
        with:
          name: Steam-Master-Idler-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
